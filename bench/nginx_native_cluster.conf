events {
    worker_connections 65535;
    multi_accept on;
}

http {
    access_log off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    upstream oxid_cluster {
        least_conn;
        server 127.0.0.1:8081 max_fails=2 fail_timeout=3s;
        server 127.0.0.1:8083 max_fails=2 fail_timeout=3s;
        keepalive 128;
    }

    server {
        listen 8080;
        server_name _;

        client_max_body_size 100M;

        location / {
            proxy_pass http://oxid_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Ajout du header de traçabilité du nœud
            add_header X-Served-By-Node $upstream_addr always;
        }
    }
}
