upstream oxid_cluster {
    least_conn;
    server oxid-node-1:8080 max_fails=3 fail_timeout=10s;
    server oxid-node-2:8080 max_fails=3 fail_timeout=10s;
}

server {
    listen 8080;
    server_name localhost;

    client_max_body_size 100M;

    location / {
        proxy_pass http://oxid_cluster;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Forward node identity header for observability
        add_header X-Served-By-Node $upstream_addr always;
    }
}
