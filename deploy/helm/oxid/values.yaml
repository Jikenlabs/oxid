# Default values for Oxid Helm Chart

replicaCount: 2

image:
  repository: oxid/oxid
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

env:
  OXID_HOST: "0.0.0.0"
  OXID_PORT: "8080"
  OXID_DATA_DIR: "/data"
  RUST_LOG: "oxid=info,tower_http=info"

# Distributed Cache (Valkey / Redis)
cache:
  enabled: true
  redisUrl: "redis://oxid-valkey:6379"

valkey:
  enabled: true
  image:
    repository: valkey/valkey
    tag: "7.2-alpine"
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 64Mi

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
  hosts:
    - host: viewer.example.com
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: 1000m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 32Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

persistence:
  enabled: true
  accessMode: ReadWriteMany
  size: 20Gi
  storageClassName: ""

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 15s
    path: /api/metrics
